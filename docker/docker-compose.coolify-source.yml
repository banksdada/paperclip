# Coolify deployment built from repository source: Paperclip server + PostgreSQL 17.
#
# Use this file with a Git-based Docker Compose resource so Coolify builds the
# image from the repository instead of pulling the published one:
#
#   - Source: your GitHub repo (public, GitHub App, or deploy key)
#   - Build pack: Docker Compose
#   - Base Directory: docker/
#   - Docker Compose Location: docker-compose.coolify-source.yml
#
# The build compiles the native runner and builds the server with a 4 GB Node
# heap. Give the build server roughly 4 vCPU / 8 GB RAM, enable the build cache,
# and set Advanced > Build > Source commit availability to "Available during
# build" so ${SOURCE_COMMIT} below resolves and the version stamp is populated.
#
# Coolify generates and persists these values on first deploy:
#
#   SERVICE_PASSWORD_64_POSTGRES   shared by the db service and DATABASE_URL
#   SERVICE_HEX_64_BETTERAUTH      session signing, same as `openssl rand -hex 32`
#   SERVICE_HEX_64_TOOLACTIONS     tool-action signing, same as `openssl rand -hex 32`
#
# Set PAPERCLIP_PUBLIC_URL (required) to the public origin, then add a domain
# for the `paperclip` service with internal port 3100 and enable TLS.
#
# Prebuilt-image deployments should use docker-compose.coolify.yml instead.

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: paperclip
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_64_POSTGRES}
      POSTGRES_DB: paperclip
    volumes:
      - paperclip-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paperclip -d paperclip"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 30s

  paperclip:
    build:
      context: ..
      dockerfile: Dockerfile
      target: production
      args:
        PAPERCLIP_BUILD_COMMIT: ${SOURCE_COMMIT:-}
        PAPERCLIP_BUILD_VERSION: ${PAPERCLIP_BUILD_VERSION:-}
    restart: unless-stopped
    # Agent runs spawn git/claude/codex descendants; the image is built around
    # this ceiling. Keep it unless the host is dedicated to a small instance.
    pids_limit: 2048
    expose:
      - "3100"
    environment:
      HOST: 0.0.0.0
      PORT: "3100"
      PAPERCLIP_HOME: /paperclip

      DATABASE_URL: postgres://paperclip:${SERVICE_PASSWORD_64_POSTGRES}@db:5432/paperclip

      BETTER_AUTH_SECRET: ${SERVICE_HEX_64_BETTERAUTH}
      PAPERCLIP_TOOL_ACTION_SIGNING_SECRET: ${SERVICE_HEX_64_TOOLACTIONS}

      PAPERCLIP_DEPLOYMENT_MODE: authenticated
      PAPERCLIP_DEPLOYMENT_EXPOSURE: public
      PAPERCLIP_PUBLIC_URL: ${PAPERCLIP_PUBLIC_URL:?}
      # TLS ends at Coolify's proxy; no host port is published, so trusting the
      # proxy is what makes client IPs, rate limits, and secure cookies correct.
      TRUST_PROXY: "true"
      # Extra hostnames beyond the public URL host (aliases, previews):
      # PAPERCLIP_ALLOWED_HOSTNAMES: ""
      # PAPERCLIP_TELEMETRY_DISABLED: "1"

      # Provider keys for local agent runs. Coolify injects application
      # variables, so adding ANTHROPIC_API_KEY / OPENAI_API_KEY in the
      # dashboard is enough; they are listed here for discoverability.
      # ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - paperclip-data:/paperclip
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:3100/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s

volumes:
  paperclip-pgdata:
  paperclip-data:
